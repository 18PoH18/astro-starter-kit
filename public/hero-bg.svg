<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F4F8"/>
      <stop offset="50%" stop-color="#D4EEF5"/>
      <stop offset="100%" stop-color="#B8E0EC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B9EB3" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2B9EB3" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="200" fill="url(#glow)"/>
  <rect x="0" y="380" width="800" height="120" fill="url(#frost)"/>
  <!-- abstract frost/mist lines -->
  <path d="M 0 200 Q 200 180 400 210 T 800 200" fill="none" stroke="#2B9EB3" stroke-width="0.5" opacity="0.3"/>
  <path d="M 0 280 Q 200 260 400 290 T 800 280" fill="none" stroke="#2B9EB3" stroke-width="0.5" opacity="0.25"/>
  <path d="M 0 150 Q 200 130 400 160 T 800 150" fill="none" stroke="#2B9EB3" stroke-width="0.3" opacity="0.2"/>
  <!-- frost dots -->
  <circle cx="100" cy="100" r="2" fill="#2B9EB3" opacity="0.3"/>
  <circle cx="700" cy="120" r="1.5" fill="#2B9EB3" opacity="0.3"/>
  <circle cx="600" cy="80" r="2.5" fill="#2B9EB3" opacity="0.2"/>
  <circle cx="200" cy="400" r="1.5" fill="#2B9EB3" opacity="0.3"/>
  <circle cx="650" cy="380" r="2" fill="#2B9EB3" opacity="0.25"/>
</svg>
