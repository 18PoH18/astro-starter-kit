      <stop offset="0%" stop-color="#E8F4F8"/>
      <stop offset="50%" stop-color="#D4EEF5"/>
      <stop offset="100%" stop-color="#B8E0EC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
